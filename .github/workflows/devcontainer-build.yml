name: Dev container build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GHCR image names must be lowercase, and GitHub expressions have no lower(),
  # so the image reference is computed once here and passed down via outputs.
  meta:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.m.outputs.image }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - name: Resolve image reference
        id: m
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >> "$GITHUB_OUTPUT"
          # One tag per branch/PR so a PR touching the Dockerfile cannot poison
          # main's image; PR tags are disposable.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

  # Stage 1: build the dev container image and publish it, once per dependency
  # flavor. Omitting runCmd makes devcontainers/ci a pure prebuild step.
  image:
    needs: meta
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # withdeps takes SDL3 from pacman, nodeps has CPM build it from source.
        deps: [withdeps, nodeps]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dev container
        uses: devcontainers/ci@v0.3
        env:
          # Read by ${localEnv:...} in the CI devcontainer.json.
          TLT_DEVCONTAINER_TARGET: archlinux-${{ matrix.deps }}
        with:
          configFile: .devcontainer/ci/devcontainer.json
          imageName: ${{ needs.meta.outputs.image }}
          imageTag: ${{ needs.meta.outputs.tag }}-${{ matrix.deps }}
          # Reuse main's layers; a miss just means a full build.
          cacheFrom: ${{ needs.meta.outputs.image }}:main-${{ matrix.deps }}
          push: always

  # Stage 2: the actual builds, run directly inside the published image. No
  # devcontainer tooling here — GitHub pulls the image and runs the steps in it.
  build:
    needs: [meta, image]
    name: ${{ matrix.platform }} · ${{ matrix.compiler }} · ${{ matrix.deps }} · ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}-${{ matrix.deps }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        # Flavors. `platform` + `compiler` spell the CMake preset name
        # (<compiler>-<platform>), `deps` picks the image built in stage 1.
        platform: [linux]
        compiler: [clang, gcc]
        deps: [withdeps, nodeps]
        build_type: [Debug, Release]

        # Room for the other platforms. Windows and Android are cross-compiled
        # from the same Linux container, so they only need a toolchain file and
        # a matching `cmake/toolchains/<compiler>-<platform>.cmake` preset:
        #
        # include:
        #   - { platform: windows, compiler: clang, deps: nodeps, build_type: RelWithDebInfo }
        #   - { platform: android, compiler: clang, deps: nodeps, build_type: Release }
        #

    env:
      # containerEnv from devcontainer.json does not apply here, so set it again.
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - uses: actions/checkout@v4

      # Only the nodeps flavor downloads anything; harmless for withdeps.
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.deps }}-${{ hashFiles('external/CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.deps }}-

      - name: Configure
        run: cmake --preset ${{ matrix.compiler }}-${{ matrix.platform }}

      - name: Build
        run: >
          cmake --build .build/${{ matrix.compiler }}-${{ matrix.platform }}
          --config ${{ matrix.build_type }}
